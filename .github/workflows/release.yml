name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Reproducibility gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run word-count check
        run: python _wordcount.py

      - name: Regenerate Table S1 and confirm it is in step with the result files
        run: |
          python _gen_table_s1.py
          git diff --exit-code

      - name: Run number-to-source consistency gate
        run: python _check_consistency.py

      - name: Regenerate figures from the shipped result files
        run: python 05_figures.py

      - name: Build and verify the submission pack
        run: |
          python _build_submission.py
          python _verify_docx.py

      - name: Upload regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            I_fig1_rorr_forest.png
            I_fig2_year_trend.png
          if-no-files-found: error

  release:
    name: Publish release bundle
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build result bundle
        run: |
          zip -r results-bundle.zip \
            01_faers_results.csv \
            01_faers_summary.md \
            10_term_dictionary.csv \
            10_term_dictionary.py \
            ANALYSIS_PLAN.md \
            REVIEW_peer_review_2026-09-16.md \
            REVIEW_round2_2026-09-17.md \
            RESPONSE_round2_2026-09-17.md \
            REVIEW_round3_2026-09-17.md \
            RESPONSE_round3_2026-09-17.md \
            REVIEW_round4_2026-09-17.md \
            REVISION_round4_2026-09-17.md \
            RESPONSE_round4_2026-09-17.md \
            _round4_leave2024.py \
            _round4_edits.py \
            _round4_trim.py \
            _round4_trim2.py \
            _round4_trim_abstract.py \
            _round3_edits.py \
            _round3_trim.py \
            _round3_trim2.py \
            _round3_trim3.py \
            _round3_trim4.py \
            02_route_stratified.csv \
            02_route_summary.md \
            03_soc_27.csv \
            D_27SOC_openFDA事件级.md \
            04_sensitivity_ps_only.csv \
            04_sensitivity_year_pain.csv \
            04_sensitivity_year_hyperaesthesia.csv \
            04_sensitivity_leave2024_hyperaesthesia.csv \
            04_sensitivity_2024cluster_hyperaesthesia.csv \
            04_sensitivity_estimable_years.json \
            04_sensitivity_summary.md \
            11_overlap_matrix.csv \
            12_role_version_sensitivity.csv \
            13_report_series_hyperaesthesia.csv \
            14_faers_pt_distribution.csv \
            15_sparse_intervals.csv \
            16_year_trend.csv \
            17_overlap_adjusted_rorr.csv \
            18_rorr_covariance.csv \
            19_leave2024_hyperaesthesia.csv \
            20_2024cluster_membership.csv \
            21_alternative_proxy_terms.csv \
            _r6_term_level_check.py \
            _r6_term_level_check.csv \
            _r6_term_dictionary_check.py \
            _r6_term_dictionary_check.csv \
            22_meddra_term_verification.md \
            cv/cv_indication_strata.csv \
            cv/cv_depth_strata.csv \
            cv/cv_reaction_onset_completeness.csv \
            cv/cv_summary.md \
            REVIEW_round5_2026-09-17.md \
            RESPONSE_round5_2026-09-17.md \
            _r6_covariance.py \
            _r6_ms_fix.py \
            _r6_t06.py \
            _r6_t224.py \
            _r6_leave2024.py \
            _r6_ms_tables.py \
            _r6_apply.py \
            _r6_drop_internal.py \
            _r6_gate_patch.py \
            _r6_gate_patch2.py \
            _r6_sync.py \
            _r6_declare.py \
            _a5_cv_indication_strata.py \
            _a5_depth_strata.py \
            _a5_overlap_faers.py \
            SUBMISSION_MANIFEST.md \
            CITATION.cff \
            _gen_table4.py \
            _check_asterisks.py \
            cv/cv_soc_27.csv \
            cv/cv_pt_summary.csv \
            cv/cv_drug_totals.csv \
            cv/cv_subgroups.csv \
            cv/cv_summary.md \
            _gen_table_s1.py \
            G_跨库验证_FAERSvsCanada.md \
            I_稿件三线表.md \
            I_正文_IMRaD_en.md \
            I_TableS2_READUS-PV_checklist.md \
            I_fig1_rorr_forest.png \
            I_fig1_rorr_forest.pdf \
            I_fig1_rorr_forest.tif \
            I_fig2_year_trend.png \
            I_fig2_year_trend.pdf \
            I_fig2_year_trend.tif

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            results-bundle.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
